    <!-- Highlights -->
    <line x1="50" y1="950" x2="750" y2="950" stroke="#d61b1b" stroke-width="2" stroke-dasharray="8,4"/>
    
    <text x="55" y="990" fill="#b45309">• GHEE KARAM DOSA</text>
    <text x="460" y="990" fill="#444" font-weight="bold" letter-spacing="3">............</text>
    <text x="680" y="990" fill="#d61b1b" font-size="25">90/-</text>

    <text x="55" y="1035" fill="#b45309">• BUTTER MASALA DOSA</text>
    <text x="500" y="1035" fill="#444" font-weight="bold" letter-spacing="3">........</text>
    <text x="680" y="1035" fill="#d61b1b" font-size="25">75/-</text>

    <text x="55" y="1080" fill="#b45309">• PANEER MASALA DOSA</text>
    <text x="510" y="1080" fill="#444" font-weight="bold" letter-spacing="3">.......</text>
    <text x="680" y="1080" fill="#d61b1b" font-size="25">80/-</text>

    <text x="55" y="1125" fill="#b45309">• PANEER BUTTER MASALA DOSA</text>
    <text x="575" y="1125" fill="#444" font-weight="bold" letter-spacing="3">..</text>
    <text x="680" y="1125" fill="#d61b1b" font-size="25">90/-</text>
