    <text x="430" y="575" fill="#444" font-weight="bold" letter-spacing="3">...............</text>
    <text x="680" y="575" fill="#d61b1b" font-size="25">70/-</text>

    <!-- Item 37: Upma Pesarattu 75/- -->
    <text x="55" y="615">37. UPMA PESARATTU</text>
    <text x="430" y="615" fill="#444" font-weight="bold" letter-spacing="3">...............</text>
    <text x="680" y="615" fill="#d61b1b" font-size="25">75/-</text>

    <!-- Item 38: Upma Dosa 75/- -->
    <text x="55" y="655">38. UPMA DOSA</text>
    <text x="345" y="655" fill="#444" font-weight="bold" letter-spacing="3">..............................</text>
    <text x="680" y="655" fill="#d61b1b" font-size="25">75/-</text>

    <!-- Item 39: 70 MM Dosa 100/- -->
