    <text x="55" y="750">40. PAPER DOSA</text>
    <text x="365" y="750" fill="#444" font-weight="bold" letter-spacing="3">............................</text>
    <text x="680" y="750" fill="#d61b1b" font-size="25">90/-</text>

    <!-- Item 41: Kakinada Pesarattu 80/- -->
    <text x="55" y="790">41. KAKINADA PESARATTU</text>
    <text x="490" y="790" fill="#444" font-weight="bold" letter-spacing="3">.......</text>
    <text x="680" y="790" fill="#d61b1b" font-size="25">80/-</text>

    <!-- Item 42: Ragi Rava Dosa 80/- -->
    <text x="55" y="830">42. RAGI RAVA DOSA</text>
    <text x="415" y="830" fill="#444" font-weight="bold" letter-spacing="3">................</text>
    <text x="680" y="830" fill="#d61b1b" font-size="25">80/-</text>

