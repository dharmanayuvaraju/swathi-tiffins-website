    <text x="345" y="415" fill="#444" font-weight="bold" letter-spacing="3">..............................</text>
    <text x="680" y="415" fill="#d61b1b" font-size="25">70/-</text>

    <!-- Item 33: Uttappa 65/- -->
    <text x="55" y="455">33. UTTAPPA</text>
    <text x="315" y="455" fill="#444" font-weight="bold" letter-spacing="3">................................</text>
    <text x="680" y="455" fill="#d61b1b" font-size="25">65/-</text>

    <!-- Item 34: Rava Dosa 65/- -->
