    <text x="680" y="495" fill="#d61b1b" font-size="25">65/-</text>

    <!-- Item 35: Set Dosa 65/- -->
    <text x="55" y="535">35. SET DOSA</text>
    <text x="315" y="535" fill="#444" font-weight="bold" letter-spacing="3">................................</text>
    <text x="680" y="535" fill="#d61b1b" font-size="25">65/-</text>

