    <text x="55" y="775">13. SAMBAR VADA</text>
    <text x="375" y="775" fill="#444" font-weight="bold" letter-spacing="3">.........................</text>
    <text x="680" y="775" fill="#d61b1b" font-size="26">60/-</text>

