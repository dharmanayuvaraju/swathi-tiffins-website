<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200" style="background:#ffd200; font-family:'Arial Black', 'Helvetica Neue', sans-serif;">
  <defs>
    <filter id="shadowT" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="headerGradT" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff0000"/>
      <stop offset="100%" stop-color="#b30000"/>
    </linearGradient>
    <linearGradient id="subHeaderGradT" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00227b"/>
      <stop offset="100%" stop-color="#001040"/>
    </linearGradient>
  </defs>

  <!-- Outer Board Frame -->
  <rect x="15" y="15" width="770" height="1170" rx="12" fill="#ffd200" stroke="#000" stroke-width="8"/>
  <rect x="25" y="25" width="750" height="1150" fill="none" stroke="#d61b1b" stroke-width="3"/>

  <!-- Main Restaurant Name Header -->
  <rect x="35" y="35" width="730" height="85" rx="8" fill="url(#headerGradT)" stroke="#000" stroke-width="3"/>
  <text x="400" y="85" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" filter="url(#shadowT)" letter-spacing="2">SRI SWATHI TIFFINS</text>
  <text x="400" y="112" font-size="20" font-weight="900" fill="#ffd200" text-anchor="middle" letter-spacing="3">( 100% PURE VEG )</text>

  <!-- Address, Phone & GST Header -->
  <rect x="35" y="130" width="730" height="70" rx="6" fill="url(#subHeaderGradT)"/>
  <text x="400" y="158" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">ST. NO. 8, HABSIGUDA, HYDERABAD</text>
  <text x="400" y="186" font-size="18" font-weight="bold" fill="#ffd200" text-anchor="middle">GST: 36EKHPK9217G1ZX  |  PH: 07995008827</text>

  <!-- Section Title Banner -->
  <rect x="120" y="215" width="560" height="48" rx="24" fill="#d61b1b" stroke="#000" stroke-width="2"/>
  <text x="280" y="248" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">TIFFINS</text>
  <text x="540" y="248" font-size="26" font-weight="900" fill="#ffd200" text-anchor="middle" letter-spacing="1">RATES</text>

  <!-- Tiffins List Items (Exact Original Prices from Image 1) -->
  <g font-size="23" font-weight="900" fill="#00227b" font-family="'Arial Black', sans-serif">
    <!-- Item 1: Idly 30/- -->
    <text x="55" y="295">1. IDLY</text>
    <text x="280" y="295" fill="#444" font-weight="bold" letter-spacing="3">.....................................</text>
    <text x="680" y="295" fill="#d61b1b" font-size="26">30/-</text>

    <!-- Item 2: Sambar Idly 40/- -->
    <text x="55" y="335">2. SAMBAR IDLY</text>
    <text x="360" y="335" fill="#444" font-weight="bold" letter-spacing="3">...........................</text>
    <text x="680" y="335" fill="#d61b1b" font-size="26">40/-</text>

    <!-- Item 3: Single Idly 18/- -->
    <text x="55" y="375">3. SINGLE IDLY</text>
    <text x="340" y="375" fill="#444" font-weight="bold" letter-spacing="3">.............................</text>
    <text x="680" y="375" fill="#d61b1b" font-size="26">18/-</text>

    <!-- Item 4: Ghee Idly 50/- -->
